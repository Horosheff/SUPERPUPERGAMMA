<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slides — AI Agents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --card: #ffffff;
      --border: #e2e5ea;
      --border-l: #d0d4db;
      --text: #1a1a2e;
      --text2: #4a4a68;
      --muted: #8890a4;
      --accent: #d52b1e;
      --accent-soft: #fde8e6;
      --accent2: #e85d52;
      --pill-bg: #f4f5f7;
      --shadow-card: 0 2px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
      --shadow-card-hover: 0 8px 30px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06);
      --shadow-modal: 0 25px 80px rgba(0,0,0,.18);
      --radius: 20px;
      --radius-s: 14px;
      --radius-xs: 10px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

    /* ─── Header ─── */
    header{padding:1rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .logo{width:38px;height:38px;background:linear-gradient(135deg,#d52b1e,#ff6b5e);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;color:#fff;box-shadow:0 2px 8px rgba(213,43,30,.25)}
    header h1{font-size:1.1rem;font-weight:700;color:var(--text)}
    header h1 span{color:var(--muted);font-weight:400;margin-left:.4rem}

    /* ─── Main ─── */
    main{flex:1;display:flex;flex-direction:column;max-width:1500px;width:100%;margin:0 auto;padding:1.5rem 2rem 2rem;gap:1.25rem}

    /* ─── Status ─── */
    .status{padding:.7rem 1.25rem;border-radius:var(--radius-xs);font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:.6rem;transition:.3s}
    .status.idle{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
    .status.running{background:#eef0ff;color:#4f56e8;border:1px solid #d4d8ff}
    .status.design{background:#fff4eb;color:#d97706;border:1px solid #fde0b8}
    .status.images{background:#e8f7fd;color:#0891b2;border:1px solid #b4e4f3}
    .status.done{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
    .status.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .spinner{width:15px;height:15px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ─── Form ─── */
    .form-row{display:flex;gap:.75rem}
    .form-row input{flex:1;padding:.85rem 1.25rem;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--surface);color:var(--text);font-size:.95rem;font-family:inherit;transition:.2s}
    .form-row input::placeholder{color:var(--muted)}
    .form-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(213,43,30,.08)}
    .form-row button{padding:.85rem 2rem;border:none;border-radius:var(--radius-xs);background:var(--accent);color:#fff;font-size:.92rem;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.2s;box-shadow:0 2px 8px rgba(213,43,30,.2)}
    .form-row button:hover{background:var(--accent2);box-shadow:0 4px 16px rgba(213,43,30,.3);transform:translateY(-1px)}
    .form-row button:active{transform:scale(.97)}
    .form-row button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

    /* ─── Workspace ─── */
    .workspace{flex:1;display:flex;gap:1.25rem;min-height:0}

    /* ─── Log ─── */
    .log-panel{width:300px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-card)}
    .log-panel.collapsed{width:44px}
    .log-hdr{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;background:var(--pill-bg)}
    .log-hdr h2{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .log-arr{color:var(--muted);font-size:.8rem;transition:.2s}
    .log-panel.collapsed .log-arr{transform:rotate(180deg)}
    .log-panel.collapsed .log-hdr h2{display:none}
    .log-body{flex:1;overflow:auto;padding:.5rem .7rem;font-family:"JetBrains Mono",monospace;font-size:.65rem;line-height:1.5}
    .log-panel.collapsed .log-body{display:none}
    .ll{padding:.1rem 0;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
    .ll .t{color:var(--accent);font-weight:600}
    .ll .e{color:#4f56e8}

    /* ─── Slides Grid ─── */
    .slides-panel{flex:1;min-width:0;overflow:auto}
    .slides-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:1.5rem;align-content:start;padding-bottom:2rem}

    /* ─── Slide Card ─── */
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;box-shadow:var(--shadow-card);cursor:default;position:relative}
    .card.ready{cursor:pointer}
    .card.ready:hover{transform:translateY(-4px);box-shadow:var(--shadow-card-hover);border-color:var(--border-l)}

    /* Accent bar */
    .card .bar{height:4px;width:100%;flex-shrink:0}

    /* Image area */
    .card .card-img{width:100%;height:210px;object-fit:cover;display:block;border-bottom:1px solid var(--border)}
    .card .card-img-ph{width:100%;height:210px;display:flex;align-items:center;justify-content:center;font-size:4.5rem;border-bottom:1px solid var(--border)}

    /* Content */
    .card .card-body{padding:1.5rem 1.75rem 1.4rem;display:flex;flex-direction:column;gap:.75rem}

    /* Pill badge */
    .card .pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:.3rem .75rem;border-radius:100px;width:fit-content}

    /* Title */
    .card .card-title{font-size:1.3rem;font-weight:800;line-height:1.25;letter-spacing:-.01em;color:var(--text)}
    .card .card-tagline{font-size:.82rem;font-weight:500;color:var(--text2);margin-top:-.15rem}

    /* Content items */
    .card .items{display:flex;flex-direction:column;gap:.35rem;margin-top:.2rem}
    .card .item{display:flex;gap:.65rem;align-items:flex-start;font-size:.88rem;line-height:1.55;color:var(--text2);padding:.3rem .6rem;border-radius:var(--radius-xs);transition:background .15s}
    .card .item.hl{background:var(--accent-soft);color:var(--text)}
    .card .item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:.5em}

    /* Notes */
    .card .card-notes{padding-top:.6rem;border-top:1px solid var(--border);font-size:.76rem;color:var(--muted);font-style:italic;line-height:1.5}

    /* Creating state */
    .card.creating{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
    .card.creating .card-title{color:var(--muted);font-size:1rem;font-weight:500}
    .pulse{width:44px;height:44px;border-radius:50%;position:relative}
    .pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;animation:pu 1.6s ease-out infinite}
    .pulse::after{animation-delay:.35s}
    @keyframes pu{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2);opacity:0}}

    /* Designing overlay */
    .card.designing{outline:2px dashed rgba(217,119,6,.3);outline-offset:-2px}
    .card.designing::after{content:'🎨 Дизайн…';position:absolute;top:.75rem;right:.75rem;font-size:.7rem;font-weight:600;background:#fff4eb;color:#d97706;padding:.25rem .6rem;border-radius:100px;box-shadow:0 1px 4px rgba(0,0,0,.06)}

    /* ─── Modal ─── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(8px)}
    .modal-bg.open{opacity:1;pointer-events:auto}

    .modal-card{width:90vw;max-width:1100px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px;box-shadow:var(--shadow-modal);transform:scale(.92) translateY(24px);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
    .modal-bg.open .modal-card{transform:scale(1) translateY(0)}

    .modal-card .m-bar{height:6px;width:100%;flex-shrink:0}
    .modal-card .m-img{width:100%;max-height:380px;object-fit:cover;display:block}
    .modal-card .m-img-ph{width:100%;height:300px;display:flex;align-items:center;justify-content:center;font-size:6rem}

    .modal-card .m-body{padding:2.5rem 3.5rem;display:flex;flex-direction:column;gap:1.25rem}
    .modal-card .m-pill{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.35rem .85rem;border-radius:100px;width:fit-content}
    .modal-card .m-title{font-size:2.5rem;font-weight:900;line-height:1.15;letter-spacing:-.02em;color:var(--text)}
    .modal-card .m-tagline{font-size:1.05rem;font-weight:500;color:var(--text2);margin-top:-.35rem}

    .modal-card .m-items{display:flex;flex-direction:column;gap:.65rem}
    .modal-card .m-item{display:flex;gap:.85rem;align-items:flex-start;font-size:1.1rem;line-height:1.6;color:var(--text2);padding:.4rem .7rem;border-radius:var(--radius-xs)}
    .modal-card .m-item.mhl{background:var(--accent-soft);color:var(--text)}
    .modal-card .m-item .md{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:.5em}
    .modal-card .m-notes{margin-top:auto;padding-top:1.25rem;border-top:1px solid var(--border);font-size:.88rem;color:var(--muted);font-style:italic;line-height:1.6}

    .m-close{position:fixed;top:1.25rem;right:1.25rem;z-index:1001;background:var(--surface);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:12px;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:1.2rem;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .modal-bg.open .m-close{display:flex}
    .m-close:hover{background:var(--pill-bg)}

    .m-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:1001;background:var(--surface);border:1px solid var(--border);color:var(--text);width:48px;height:48px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:1.4rem;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .modal-bg.open .m-nav{display:flex}
    .m-nav:hover{background:var(--pill-bg)}
    .m-nav.prev{left:1.25rem}
    .m-nav.next{right:1.25rem}

    .m-dots{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:1001;display:none;gap:.5rem;align-items:center;background:var(--surface);padding:.5rem .75rem;border-radius:100px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid var(--border)}
    .modal-bg.open .m-dots{display:flex}
    .m-dots .di{width:9px;height:9px;border-radius:50%;background:var(--border-l);transition:.2s;cursor:pointer}
    .m-dots .di.active{transform:scale(1.3)}

    @media(max-width:900px){
      .workspace{flex-direction:column}
      .log-panel{width:100%}
      .slides-grid{grid-template-columns:1fr}
      .modal-card .m-body{padding:1.5rem}
      .modal-card .m-title{font-size:1.5rem}
      main{padding:1rem}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">S</div>
  <h1>Slides<span>— 5 agents + Design Agent</span></h1>
</header>

<main>
  <div id="status" class="status idle">Введите тему и нажмите «Создать». Контент → Дизайн → Изображения.</div>

  <div class="form-row">
    <input type="text" id="topic" placeholder="Тема презентации (например: Введение в ИИ)" />
    <button type="button" id="run">Создать слайды</button>
  </div>

  <div class="workspace">
    <div class="log-panel" id="logPanel">
      <div class="log-hdr" id="logToggle">
        <h2>Лог агентов</h2>
        <div class="log-arr">◀</div>
      </div>
      <div class="log-body" id="log"></div>
    </div>
    <div class="slides-panel">
      <div class="slides-grid" id="slides"></div>
    </div>
  </div>
</main>

<!-- Modal -->
<div id="modal" class="modal-bg">
  <button class="m-close" id="mClose">✕</button>
  <button class="m-nav prev" id="mPrev">‹</button>
  <button class="m-nav next" id="mNext">›</button>
  <div class="modal-card" id="mCard"></div>
  <div class="m-dots" id="mDots"></div>
</div>

<script>
const N=5;
const FALLBACK_COLORS=['#4f56e8','#d52b1e','#0891b2','#059669','#d97706'];

const $=id=>document.getElementById(id);
const statusEl=$('status'),topicEl=$('topic'),runBtn=$('run'),logEl=$('log'),
      slidesEl=$('slides'),logPanel=$('logPanel'),logToggle=$('logToggle'),
      modalEl=$('modal'),mCard=$('mCard'),mClose=$('mClose'),
      mPrev=$('mPrev'),mNext=$('mNext'),mDots=$('mDots');

let state=[],curM=-1;

function esc(s){const d=document.createElement('div');d.textContent=typeof s==='string'?s:String(s);return d.innerHTML}

/* Status */
function setStatus(cls,txt,spin){
  statusEl.className='status '+cls;
  statusEl.innerHTML=(spin?'<div class="spinner"></div>':'')+(cls==='done'?'✓ ':'')+esc(txt);
}

/* Log */
logToggle.onclick=()=>logPanel.classList.toggle('collapsed');
function addLog(e){
  const d=document.createElement('div');d.className='ll';
  const tag=e.event||'',inner=e.data||{},ev=inner.event||'',
        dat=inner.data!==undefined?(typeof inner.data==='object'?JSON.stringify(inner.data):String(inner.data)):'';
  d.innerHTML='<span class="t">'+esc(tag)+'</span> <span class="e">'+esc(ev)+'</span> '+esc(dat).slice(0,180);
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}

/* State */
function ensure(){while(state.length<N)state.push({phase:'creating'})}
function setSlide(idx,slide){
  ensure();const i=idx-1;if(i<0||i>=N)return;
  const p=state[i];
  state[i]={...p,phase:p.phase==='creating'?'content':p.phase,slide:slide||null};
  render(i);
}
function setDesign(idx,design){
  ensure();const i=idx-1;if(i<0||i>=N)return;
  state[i]={...state[i],phase:'designed',design};
  render(i);
}
function setImage(idx,img){
  ensure();const i=idx-1;if(i<0||i>=N)return;
  state[i]={...state[i],imageBase64:img};
  render(i);
}

/* Design helpers */
function ac(i){const d=state[i]&&state[i].design;return d&&d.accentColor?d.accentColor:FALLBACK_COLORS[i%5]}
function acSoft(i){return ac(i)+'14'}
function icon(i){const d=state[i]&&state[i].design;return d&&d.icon?d.icon:'📄'}
function tagline(i){const d=state[i]&&state[i].design;return d&&d.tagline?d.tagline:''}
function hlSet(i){const d=state[i]&&state[i].design;return new Set(d&&Array.isArray(d.highlightLines)?d.highlightLines:[])}

/* ─── Render Card ─── */
function render(i){
  let el=document.getElementById('s'+i);
  if(!el){el=document.createElement('div');el.id='s'+i;slidesEl.appendChild(el)}
  const s=state[i], a=ac(i);

  if(!s||s.phase==='creating'){
    el.className='card creating';
    el.innerHTML=
      '<div class="bar" style="background:'+a+'"></div>'+
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem">'+
        '<div class="pulse" style="background:'+a+'"></div>'+
        '<div class="card-title">Агент '+(i+1)+' создаёт слайд…</div>'+
      '</div>';
    el.onclick=null;return;
  }

  const slide=s.slide, designed=!!s.design;
  const title=slide?(slide.title||''):'';
  const body=(slide&&slide.body)?slide.body:[];
  const notes=slide&&slide.notes?slide.notes:'';
  const hl=hlSet(i), ic=icon(i), tl=tagline(i);

  el.className='card ready'+(designed?'':' designing');

  // Image
  let imgH='';
  if(s.imageBase64){
    imgH='<img class="card-img" src="data:image/png;base64,'+s.imageBase64+'" alt="" />';
  } else {
    imgH='<div class="card-img-ph" style="background:'+acSoft(i)+'">'+ic+'</div>';
  }

  // Items
  let itemsH='';
  body.forEach(function(line,j){
    const isHl=hl.has(j);
    itemsH+='<div class="item'+(isHl?' hl':'')+'"><div class="dot" style="background:'+a+'"></div><span>'+esc(line)+'</span></div>';
  });

  let notesH=notes?'<div class="card-notes">'+esc(notes)+'</div>':'';
  let pillH='<div class="pill" style="background:'+acSoft(i)+';color:'+a+'"><span>'+ic+'</span> Слайд '+(i+1)+'</div>';
  let tagH=tl?'<div class="card-tagline">'+esc(tl)+'</div>':'';

  el.innerHTML=
    '<div class="bar" style="background:'+a+'"></div>'+
    imgH+
    '<div class="card-body">'+
      pillH+
      '<div class="card-title">'+esc(title)+'</div>'+
      tagH+
      '<div class="items">'+itemsH+'</div>'+
      notesH+
    '</div>';

  el.onclick=function(){openModal(i)};
}

function renderAll(){ensure();slidesEl.innerHTML='';for(let i=0;i<N;i++){const el=document.createElement('div');el.id='s'+i;slidesEl.appendChild(el);render(i)}}

/* ─── Modal ─── */
function openModal(i){
  const s=state[i];if(!s||!s.slide)return;
  curM=i;renderModal(i);modalEl.classList.add('open');document.body.style.overflow='hidden';
}

function renderModal(i){
  const s=state[i];if(!s||!s.slide)return;
  const slide=s.slide, a=ac(i), ic=icon(i), tl=tagline(i), hl=hlSet(i);

  let imgH='';
  if(s.imageBase64) imgH='<img class="m-img" src="data:image/png;base64,'+s.imageBase64+'" alt="" />';
  else imgH='<div class="m-img-ph" style="background:'+acSoft(i)+'">'+ic+'</div>';

  let itemsH='';
  (slide.body||[]).forEach(function(line,j){
    const isHl=hl.has(j);
    itemsH+='<div class="m-item'+(isHl?' mhl':'')+'"><div class="md" style="background:'+a+'"></div><span>'+esc(line)+'</span></div>';
  });

  let notesH=slide.notes?'<div class="m-notes">'+esc(slide.notes)+'</div>':'';
  let tagH=tl?'<div class="m-tagline">'+esc(tl)+'</div>':'';

  mCard.innerHTML=
    '<div class="m-bar" style="background:'+a+'"></div>'+
    imgH+
    '<div class="m-body">'+
      '<div class="m-pill" style="background:'+acSoft(i)+';color:'+a+'">'+ic+' Слайд '+(i+1)+' из '+N+'</div>'+
      '<div class="m-title">'+esc(slide.title||'')+'</div>'+
      tagH+
      '<div class="m-items">'+itemsH+'</div>'+
      notesH+
    '</div>';

  let dotsH='';
  for(let j=0;j<N;j++) dotsH+='<div class="di'+(j===i?' active':'')+'" data-i="'+j+'" style="'+(j===i?'background:'+a:'')+'"></div>';
  mDots.innerHTML=dotsH;
  mDots.querySelectorAll('.di').forEach(function(d){d.onclick=function(){const idx=+this.dataset.i;if(state[idx]&&state[idx].slide){curM=idx;renderModal(idx)}}});
}

function closeModal(){modalEl.classList.remove('open');document.body.style.overflow='';curM=-1}
mClose.onclick=closeModal;
modalEl.onclick=function(e){if(e.target===modalEl)closeModal()};
mPrev.onclick=function(){let n=curM-1;while(n>=0&&(!state[n]||!state[n].slide))n--;if(n>=0){curM=n;renderModal(n)}};
mNext.onclick=function(){let n=curM+1;while(n<N&&(!state[n]||!state[n].slide))n++;if(n<N){curM=n;renderModal(n)}};
document.addEventListener('keydown',function(e){if(curM<0)return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')mPrev.click();if(e.key==='ArrowRight')mNext.click()});

/* ─── SSE ─── */
runBtn.addEventListener('click',async function(){
  const topic=topicEl.value.trim()||'Презентация';
  runBtn.disabled=true;logEl.innerHTML='';state=[];
  setStatus('running','Фаза 1: 5 агентов создают контент…',true);
  renderAll();

  try{
    const res=await fetch('/api/slides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic})});
    if(!res.ok||!res.body){setStatus('error','Ошибка: '+res.status);runBtn.disabled=false;return}
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',designSeen=false,imgSeen=false;

    while(true){
      const{value,done}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop()||'';
      for(const p of parts) processLine(p);
    }
    if(buf.trim()) buf.split('\n\n').forEach(function(l){processLine(l)});

    function processLine(line){
      if(!line.startsWith('data: '))return;
      try{
        const m=JSON.parse(line.slice(6));
        if(m.type==='log'){
          addLog(m);
          if(!designSeen&&m.event&&String(m.event).includes('DesignAgent')){designSeen=true;setStatus('design','Фаза 2: Дизайн-агент стилизует слайды…',true)}
        }
        else if(m.type==='slide') setSlide(m.index,m.slide);
        else if(m.type==='design') setDesign(m.index,m.design);
        else if(m.type==='slideImage'){
          if(!imgSeen){imgSeen=true;setStatus('images','Фаза 3: Генерация изображений (Nano Banana)…',true)}
          setImage(m.index,m.imageBase64);
        }
        else if(m.type==='done'){
          setStatus('done','Готово! '+N+' слайдов с дизайном и изображениями.');
          const list=m.slides||[],designs=m.designs||[];
          for(let i=0;i<N;i++){
            setSlide(i+1,list[i]||null);
            if(designs[i])setDesign(i+1,designs[i]);
          }
        }
        else if(m.type==='error') setStatus('error',m.message||'Ошибка');
      }catch(_){}
    }
  }catch(e){setStatus('error',e.message||'Ошибка сети')}
  runBtn.disabled=false;
});
</script>
</body>
</html>
